# LLM Provider Configuration
# Switch profiles by changing the PROFILE env var or passing --profile to the client

defaults:
  timeout_ms: 300000
  max_retries: 3
  retry_backoff_ms: 1000
  model_id: "default"
  max_total_input_tokens: 25000000
  max_total_output_tokens: 4000000
  # Rate limit protection
  max_rate_limit_retries: 8
  rate_limit_backoff_ms: 30000
  rate_limit_backoff_multiplier: 2.0
  rate_limit_backoff_max_ms: 300000
  # TPM/RPM — set by user after checking console
  # doubao-pro-32k typical: 300K TPM, 60 RPM
  tpm_limit: 0
  rpm_limit: 0

profiles:
  mock:
    provider: mock
    model_id: "doubao-seed-evolving"
    base_url: "https://ark.cn-beijing.volces.com/api/plan/v3"
    api_key: "${MOCK_API_KEY}"
    mock_response_dir: "config/mock_responses"

  doubao:
    provider: doubao
    model_id: "doubao-seed-evolving"
    base_url: "https://ark.cn-beijing.volces.com/api/plan/v3"
    api_key: "${ARK_API_KEY}"
    timeout_ms: 2700000
    max_retries: 5

  openviking:
    provider: openviking
    model_id: "viking-retrieval"
    base_url: "https://api.vikingdb.cn-beijing.volces.com/openviking"
    api_key: "${ARK_API_KEY}"
    library_id: "ov-290dce6904ec3189"
    timeout_ms: 120000
    max_retries: 3
    tool_type: memory